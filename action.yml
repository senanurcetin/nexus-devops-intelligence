name: NEXUS commit checks
description: Read-only summary of the GitHub Checks and commit statuses reported for one exact commit SHA.
author: senanurcetin
branding:
  icon: check-circle
  color: blue

inputs:
  repository:
    description: Target repository as owner/repo. Defaults to the repository running the workflow.
    required: false
    default: ${{ github.repository }}
  sha:
    description: Full 40-character commit SHA. Defaults to the pull request head SHA, or github.sha outside pull requests.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  token:
    description: Token used only for read requests to api.github.com (raises rate limits, allows private repositories). Pass an empty string to run anonymously.
    required: false
    default: ${{ github.token }}
  fail-on-failure:
    description: Fail this step when at least one failing check or status record is observed ("true" or "false").
    required: false
    default: "true"

outputs:
  coverage:
    description: Which sources were verified - both_sources, checks_only, commit_statuses_only or none.
    value: ${{ steps.collect.outputs.coverage }}
  failure-count:
    description: Number of failing check/status records observed.
    value: ${{ steps.collect.outputs.failure-count }}
  pending-count:
    description: Number of pending check/status records observed (includes this workflow if it targets its own commit).
    value: ${{ steps.collect.outputs.pending-count }}
  success-count:
    description: Number of passing check/status records observed.
    value: ${{ steps.collect.outputs.success-count }}

runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_FAIL_ON_FAILURE: ${{ inputs.fail-on-failure }}
        NEXUS_GITHUB_TOKEN: ${{ inputs.token }}
        NEXUS_DEVOPS_ALLOW_GITHUB_TOKEN: ${{ inputs.token != '' && '1' || '0' }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-commit-checks.mjs"
